schema: 1

package:
  name: governance-rewards-automation-v1
  version: 0.1.0
  source: daml
  sdk: workspace

  dependencies:
    daml-script: builtin
    daml-stdlib: builtin

  data-dependencies:
    governance-action-v1: member

    splice-wallet:
      git: https://github.com/canton-network/splice
      commit: d5b780b5b636fe46f6f77e87c7655ddaf53c50fc
      path: daml/dars/splice-wallet-0.1.18.dar


    # 0.1.19 exposes the concrete RewardCouponV2 that Delegation_Assign pins to.
    splice-amulet:
      git: https://github.com/canton-network/splice
      commit: d5b780b5b636fe46f6f77e87c7655ddaf53c50fc
      path: daml/dars/splice-amulet-0.1.19.dar


    splice-api-reward-assignment-v1:
      git: https://github.com/canton-network/splice
      commit: d5b780b5b636fe46f6f77e87c7655ddaf53c50fc
      path: daml/dars/splice-api-reward-assignment-v1-1.0.0.dar


    splice-api-token-metadata-v1:
      git: https://github.com/canton-network/splice
      commit: d5b780b5b636fe46f6f77e87c7655ddaf53c50fc
      path: daml/dars/splice-api-token-metadata-v1-1.0.0.dar


  build-arguments:
  - --target=2.2
  - --ghc-option=-Wunused-binds
  - --ghc-option=-Wunused-matches
