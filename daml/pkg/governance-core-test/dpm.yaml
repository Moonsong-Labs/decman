schema: 1

package:
  name: governance-core-test
  version: 0.1.0
  source: daml
  sdk: workspace

  dependencies:
    daml-script: builtin
    daml-stdlib: builtin

  data-dependencies:
    governance-action-v1: member
    governance-core-v1: member
    testlib:
      version: "0.1.0"
      registry: main


    splice-util:
      git: https://github.com/canton-network/splice
      commit: d5b780b5b636fe46f6f77e87c7655ddaf53c50fc
      path: daml/dars/splice-util-0.1.4.dar


  build-arguments:
  - --target=2.2
  - -Wno-upgrade-interfaces
  - -Wno-template-interface-depends-on-daml-script
  - --ghc-option=-Wunused-binds
  - --ghc-option=-Wunused-matches
